; === macOS Metal 冻结诊断：临时项目配置（2026-07-24） ===
; 适用范围：仅 macOS 包体；Windows 和任何引擎/插件源码均不受影响。
; 依据：Windows Host -> Mac Join 的首份冻结 sample 显示，后台可见性任务
; 卡在 FMetalDynamicRHI::RHIGetRenderQueryResult，随后 Render/GameThread 在帧尾围栏等待。
; 作用：关闭“硬件”遮挡查询，避免该条已观测到的 Metal query-result 等待链。
; 代价：被遮挡的网格可能仍参与渲染；复杂室内场景可能降低帧率、增加耗电/发热。
; 不会关闭视锥裁剪、距离裁剪或 LOD。
; 删除/回滚条件：Epic/UE 修复该 Metal 等待问题后，将此值改回 True，并完成
; Windows Host -> Mac Join 60 秒回归测试；具体采样和验收条件见
; Docs/Tasks/SessionUI/MacSteamFreezeAndFind_Handoff_交接.md。
[/Script/Engine.RendererSettings]
r.AllowOcclusionQueries=False
